<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{.HeadTitle}} · papercast-archiver</title>
<style>
  :root {
    --bg: #f7f6f3;
    --fg: #1a1a1a;
    --muted: #6f6c66;
    --btn-bg: #1a1a1a;
    --btn-fg: #ffffff;
    --danger: #bb3a2e;
    --success: #2e7d32;
    --panel: rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a19;
      --fg: #ecebe8;
      --muted: #9d9a94;
      --btn-bg: #ecebe8;
      --btn-fg: #1b1a19;
      --danger: #d1493c;
      --success: #66bb6a;
      --panel: rgba(255, 255, 255, 0.08);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    -webkit-text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 24rem; text-align: center; }
  h1 { font-size: 1.45rem; font-weight: 700; }
  .article { margin: 1.25rem 0 0; }
  .article .title { font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
  .article .domain { color: var(--muted); margin-top: 0.35rem; font-size: 0.95rem; overflow-wrap: anywhere; }
  .actions { display: flex; flex-direction: column; gap: 0.85rem; margin-top: 2rem; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 3rem;
    padding: 0.9rem 1.25rem;
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--btn-fg);
  }
  .btn-danger { background: var(--danger); color: #ffffff; }
  .check { color: var(--success); margin-bottom: 1rem; }
  .error-details {
    text-align: left;
    background: var(--panel);
    border-radius: 8px;
    padding: 1rem;
    margin-top: 1.5rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main>
{{template "content" .}}
</main>
</body>
</html>

{{define "article"}}
{{if or .Title .Domain}}
<div class="article">
  {{if .Title}}<div class="title">{{.Title}}</div>{{end}}
  {{if .Domain}}<div class="domain">{{.Domain}}</div>{{end}}
</div>
{{end}}
{{end}}
